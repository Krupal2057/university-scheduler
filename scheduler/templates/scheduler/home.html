<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>University Scheduling System</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-3">University Campus Scheduling &amp; Optimization System</h1>
        <p class="text-muted">Stage 1: Project foundation is running.</p>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">System status</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Django web server: <strong>running</strong></li>
                    <li class="list-group-item">C++ algorithm engine: <strong>{{ cpp_status }}</strong></li>
                    <li class="list-group-item">C++ engine says: <em>"{{ cpp_message }}"</em></li>
                </ul>
            </div>
        </div>

        <a href="{% url 'generate_timetable' %}" class="btn btn-primary mt-4">
            Generate Timetable
        </a>
        <a href="{% url 'compare' %}" class="btn btn-outline-secondary mt-4">
            Compare Algorithms
        </a>
    </div>
</body>
</html>
